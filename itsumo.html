<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>いつもと違う｜精神科ナースのお仕事</title>
<meta name="description" content="新人看護師のための急変・副作用の早期発見トレーニング。昨日と今日の患者の挿絵と観察表を見比べ、イレウス・水中毒・悪性症候群・リチウム中毒・誤嚥・深部静脈血栓症・低血糖・アカシジアを見抜く。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* いつもと違う（精神科ナースのお仕事 F）
   方針：同じ患者の「昨日」と「今日」の2枚の挿絵（generate_image で作成した教科書風イラスト）と
   観察記録の比較表を並べ、違いを見つける「間違い探し」＋クロスフェード比較＋SVG/CSS動き重ね。
   全画面（html.is-max）で1場面がページ全体をスクロールせずに収まる設計。 */
:root{
  --bg:#E8EDEB;--paper:#FFFFFF;--paper-2:#F2F6F4;--paper-3:#E5ECE9;
  --ink:#141E1C;--ink-2:#3C4A47;--ink-3:#54635F;
  --line:#CFDAD6;--line-strong:#9EAEA9;
  --accent:#2744D1;--accent-2:#1E36AE;--accent-soft:#E5EAFB;--on-accent:#FFFFFF;
  --nurse:#0C766A;--nurse-2:#095B51;--nurse-soft:#DEF3EF;
  --stage-bg:#142030;--stage-bg-2:#1B2B40;--stage-ink:#EEF4FA;--stage-sub:#A9BDD4;
  --amber:#C67A08;--amber-soft:#FFF3D6;
  --ok:#127844;--ok-soft:#E0F3E8;--ng:#BF3325;--ng-soft:#FDEAE8;
  --diff:#D93829;--diff-soft:#FDECE9;
  --f-display:"DotGothic16","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut-l:max(12px,env(safe-area-inset-left,0px));
  --gut-r:max(12px,env(safe-area-inset-right,0px));
  --shadow:0 1px 2px rgba(16,24,22,.06),0 6px 18px rgba(16,24,22,.07);
  --radius:14px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513;--paper:#17211F;--paper-2:#202D2A;--paper-3:#283734;
    --ink:#ECF2F0;--ink-2:#C1CECA;--ink-3:#99AAA5;
    --line:#2D3C39;--line-strong:#4D615B;
    --accent:#8CA2FF;--accent-2:#A8B8FF;--accent-soft:#1D2754;--on-accent:#0B102E;
    --nurse:#4FD1C0;--nurse-2:#76E0D2;--nurse-soft:#123833;
    --amber:#F2B84B;--amber-soft:#382A0E;
    --ok:#5FD493;--ok-soft:#163322;--ng:#FF8C7E;--ng-soft:#3D1E1B;
    --diff:#FF8070;--diff-soft:#3B1A18;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513;--paper:#17211F;--paper-2:#202D2A;--paper-3:#283734;
  --ink:#ECF2F0;--ink-2:#C1CECA;--ink-3:#99AAA5;
  --line:#2D3C39;--line-strong:#4D615B;
  --accent:#8CA2FF;--accent-2:#A8B8FF;--accent-soft:#1D2754;--on-accent:#0B102E;
  --nurse:#4FD1C0;--nurse-2:#76E0D2;--nurse-soft:#123833;
  --amber:#F2B84B;--amber-soft:#382A0E;
  --ok:#5FD493;--ok-soft:#163322;--ng:#FF8C7E;--ng-soft:#3D1E1B;
  --diff:#FF8070;--diff-soft:#3B1A18;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.32);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.65;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 相互リンク帯 ---------- */
.sister-bar{
  background:var(--paper-2);border-bottom:1px solid var(--line);
  font-size:12.5px;
}
.sister-in{
  max-width:1160px;margin:0 auto;
  padding:4px var(--gut-r) 4px var(--gut-l);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.sister-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sister-link{
  display:inline-flex;align-items:center;gap:4px;
  min-height:44px;padding:2px 8px;border-radius:8px;
  text-decoration:none;font-weight:700;color:var(--accent);
}
.sister-link:hover{background:var(--accent-soft)}
.sister-link.is-sub{color:var(--nurse);background:var(--nurse-soft)}
.sister-link.is-sub:hover{filter:brightness(.96)}
.ward-pill{
  font-size:11.5px;color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;
}

/* ---------- 上部バー ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1160px;margin:0 auto;
  padding:6px var(--gut-r) 6px var(--gut-l);
  min-height:56px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
}
.brand{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;
  font-family:var(--f-display);font-size:18px;letter-spacing:.02em;
  color:var(--ink);text-decoration:none;white-space:nowrap;min-width:0;
}
.brand-ic{
  width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;background:var(--stage-bg);color:#FFD980;
  font-size:15px;
}
.brand b{font-weight:inherit;color:var(--nurse)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.tbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:44px;min-width:44px;padding:0 11px;border-radius:999px;
  border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s;
}
.tbtn:hover{border-color:var(--nurse)}
.tbtn:active{transform:scale(.96)}
.tbtn[aria-pressed="true"]{background:var(--nurse);border-color:var(--nurse);color:#fff}
.tbtn-max{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbtn-max:hover{background:var(--accent);color:var(--on-accent)}
.tbtn-icon{width:44px;padding:0}
#optionsbtn{gap:0}
@media (max-width:480px){
  .brand{font-size:15.5px}
  .tbtn{padding:0 9px;font-size:12px}
  .lbl-sm{display:none}
}
@media (max-width:340px){
  .brand-ic{display:none}
}

/* ---------- メイン領域 ---------- */
.wrap{
  max-width:1160px;margin:0 auto;
  padding:12px var(--gut-r) 24px var(--gut-l);
}

/* 場面タイムライン */
.timeline{
  display:flex;align-items:center;gap:6px;overflow-x:auto;
  padding:2px 0 8px;margin-bottom:8px;scrollbar-width:thin;
}
.tl-item{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  min-height:44px;padding:0 12px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);
  font-size:12.5px;font-weight:700;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.tl-item:hover{border-color:var(--nurse)}
.tl-item.is-now{
  background:var(--stage-bg);border-color:var(--stage-bg);color:#FFE8A3;
}
.tl-item.is-done{
  background:var(--ok-soft);border-color:var(--ok);color:var(--ok);
}
.tl-clock{font-family:var(--f-mono);font-size:12px}

/* ---------- ステージと設問の2列レイアウト ---------- */
.play-grid{
  display:grid;grid-template-columns:1fr;gap:12px;align-items:start;
}
@media (min-width:920px){
  .play-grid{grid-template-columns:minmax(0,1.16fr) minmax(0,.84fr);gap:14px}
}

.left-pane{display:flex;flex-direction:column;gap:8px;min-width:0}

/* 患者カード */
.chart-strip{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  box-shadow:var(--shadow);
}
.time-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;background:var(--stage-bg);color:#FFE8A3;
  font-family:var(--f-mono);font-size:12.5px;font-weight:700;
}
.place-badge{
  font-size:12px;font-weight:700;color:var(--nurse);
  background:var(--nurse-soft);padding:3px 9px;border-radius:8px;
}
.who-main{font-weight:700;font-size:14.5px;color:var(--ink)}
.who-dx{font-size:12.5px;color:var(--ink-2)}
.who-keys{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.key-chip{
  font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);
}

/* ---------- 昨日と今日の2枚見比べ＆間違い探しステージ ---------- */
.stage-card{
  background:var(--stage-bg);border:1.5px solid #2A3F5A;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.diff-bar{
  background:var(--stage-bg-2);border-bottom:1px solid #2B425E;
  padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.diff-info{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;
}
.diff-title{
  font-size:12px;font-weight:700;color:var(--stage-ink);
  display:inline-flex;align-items:center;gap:5px;
}
.diff-count{
  font-family:var(--f-mono);font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:999px;
  background:#233750;color:#FFE8A3;border:1px solid #4A6A92;
}
.diff-count.is-all{
  background:#123829;color:#A3F5CC;border-color:#35B87B;
}
.diff-tools{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.spot-btn{
  min-height:44px;padding:0 10px;border-radius:10px;
  border:1.5px solid #365073;background:#192A40;color:var(--stage-ink);
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;touch-action:manipulation;
  transition:all .15s;
}
.spot-btn:hover{border-color:#88B4E8}
.spot-btn.is-on{background:#153D38;border-color:#4FD1C0;color:#D9FFF8}

/* 2枚比較／クロスフェード領域 */
.stage-box{
  position:relative;width:100%;
  background:#101A28;user-select:none;-webkit-user-select:none;
  padding:8px;
}
.compare-panels{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
  align-items:stretch;
}
.illust-panel{
  position:relative;border-radius:11px;overflow:hidden;
  background:#F6F4EE;border:2px solid #334C6B;
  aspect-ratio:4/4.35;display:flex;align-items:center;justify-content:center;
}
.illust-panel.is-today{
  border-color:#FF8070;box-shadow:0 0 0 1px rgba(255,128,112,.35);
}
.scene-illust{
  width:100%;height:100%;object-fit:cover;display:block;
}
.panel-tag{
  position:absolute;top:6px;left:6px;z-index:5;
  padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;
}
.panel-tag.is-yest{
  background:rgba(20,32,48,.88);color:#D6E6F7;border:1px solid #5B789C;
}
.panel-tag.is-today{
  background:rgba(158,34,24,.94);color:#FFF5F3;border:1px solid #FFA59B;
}
.panel-metric{
  position:absolute;top:32px;left:6px;z-index:5;max-width:calc(100% - 12px);
  padding:2px 7px;border-radius:7px;font-size:10.5px;font-weight:700;
  font-family:var(--f-mono);pointer-events:none;
  background:rgba(14,22,34,.86);color:#FFE8A3;border:1px solid rgba(255,232,163,.4);
}
.panel-metric.is-alert{
  background:rgba(68,14,14,.92);color:#FFD4CE;border-color:#FF8070;
}

/* クロスフェード（重ねて見比べる）モード */
.compare-panels.is-xfade{
  grid-template-columns:1fr;max-width:440px;margin:0 auto;
}
.compare-panels.is-xfade .illust-panel.is-yest{
  display:none;
}
.xfade-layer{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;z-index:1;
  animation:xfadeLoop 3.8s ease-in-out infinite;
}
@keyframes xfadeLoop{
  0%,15%{opacity:1}
  45%,65%{opacity:0}
  90%,100%{opacity:1}
}

/* 画像の上に重ねる SVG アニメレイヤー */
.overlay-svg{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:3;
}

/* 間違い探し（変化ポイント）ピン */
.diff-pin{
  position:absolute;z-index:6;
  width:44px;height:44px;margin-left:-22px;margin-top:-22px;
  border-radius:999px;border:none;background:transparent;
  display:grid;place-items:center;cursor:pointer;padding:0;
  touch-action:manipulation;
}
.diff-pin-core{
  min-width:26px;height:26px;padding:0 6px;border-radius:999px;
  background:rgba(205,40,28,.94);color:#FFFFFF;
  border:2px solid #FFF2B2;font-size:11.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
  transition:transform .15s,background .15s;
  animation:pinPulse 1.6s ease-in-out infinite;
}
.diff-pin:hover .diff-pin-core{transform:scale(1.1)}
.diff-pin.is-found .diff-pin-core{
  background:rgba(16,124,75,.95);border-color:#B2FFE0;animation:none;
}
.diff-pin.is-active .diff-pin-core{
  transform:scale(1.14);box-shadow:0 0 0 3px rgba(255,232,163,.65);
}

/* ステージ下部の患者の声・観察ポイント字幕 */
.stage-sub{
  margin-top:6px;display:flex;justify-content:center;
}
.sub-chip{
  width:100%;background:rgba(12,20,32,.94);color:#FFF7DF;
  border:1.5px solid #486487;border-radius:10px;
  padding:6px 11px;font-size:12.5px;font-weight:700;line-height:1.45;
  display:flex;align-items:center;gap:7px;
}
.sub-chip.is-spot{
  border-color:#FF8C7E;background:rgba(46,16,18,.94);color:#FFEAE6;
}
.vol-tag{
  font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;flex:none;
  background:rgba(255,255,255,.14);color:#FFE8A3;
}

/* ---------- 昨日と今日の観察記録・比較表（compare） ---------- */
.compare-card{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;box-shadow:var(--shadow);
}
.compare-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:5px;font-size:12px;font-weight:700;color:var(--ink-2);
}
.compare-table{
  width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12.5px;
}
.compare-row td,.compare-row th{
  padding:6px 8px;background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  vertical-align:middle;line-height:1.35;
}
.compare-row th{
  text-align:left;font-weight:700;color:var(--ink);
  border-left:1px solid var(--line);border-radius:8px 0 0 8px;width:28%;
}
.compare-jump{
  min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;
  text-align:left;text-decoration:underline;text-underline-offset:.2em;cursor:pointer;
}
.compare-row td.col-yest{
  color:var(--ink-2);width:31%;
}
.compare-row td.col-today{
  font-weight:700;width:41%;
  border-right:1px solid var(--line);border-radius:0 8px 8px 0;
}
.compare-row.is-changed td.col-today{
  background:var(--diff-soft);color:var(--diff);border-color:var(--diff);
}
.compare-row.is-changed th{
  border-left:3px solid var(--diff);
}
.chg-badge{
  display:inline-flex;align-items:center;gap:2px;
  font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;
  margin-right:4px;white-space:nowrap;
}
.chg-badge.is-diff{background:var(--diff);color:#fff}
.chg-badge.is-same{background:var(--paper-3);color:var(--ink-2)}

/* ---------- 右ペイン：問い・選択肢・先輩・試験 ---------- */
.right-pane{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);min-width:0;
  display:flex;flex-direction:column;gap:10px;
}
.step-tabs{
  display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;
}
.step-tag{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--paper-2);color:var(--ink-3);border:1px solid var(--line);
}
.step-tag.is-on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.step-tag.is-done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

.right-scroll{display:flex;flex-direction:column;gap:8px}
.q-title{
  margin:0;font-family:var(--f-display);font-size:17px;line-height:1.45;color:var(--ink);
}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  width:100%;min-height:46px;padding:9px 12px;border-radius:11px;
  border:1.5px solid var(--line-strong);background:var(--paper-2);
  color:var(--ink);text-align:left;font-size:14px;line-height:1.45;
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;
  touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt-num{
  flex:none;width:24px;height:24px;border-radius:7px;margin-top:1px;
  background:var(--paper);border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);
}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.is-ok .opt-num{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ink)}
.opt.is-ng .opt-num{background:var(--ng);border-color:var(--ng);color:#fff}

/* 解説ボックス */
.exp{
  border-radius:12px;padding:10px 12px;border:1.5px solid var(--line);
  background:var(--paper-2);font-size:13.5px;line-height:1.55;
}
.exp.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.exp.is-ng{border-color:var(--ng);background:var(--ng-soft)}
.exp-head{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.exp-src{margin-top:5px;font-size:11.5px;color:var(--ink-2);word-break:break-all}

/* 先輩のひとこと */
.senpai-box{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:var(--nurse-soft);border:1.5px solid var(--nurse);
}
.senpai-av{
  width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;
  background:var(--paper);border:1.5px solid var(--nurse);
}
.senpai-av img{width:100%;height:100%;object-fit:cover;display:block}
.senpai-body{min-width:0;font-size:13.5px;line-height:1.5}
.senpai-name{font-size:11.5px;font-weight:700;color:var(--nurse);margin-bottom:2px}

.exam-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);
}

/* アクションボタン */
.act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn-primary{
  flex:1;min-height:46px;padding:0 16px;border-radius:12px;
  border:none;background:var(--accent);color:var(--on-accent);
  font-size:14.5px;font-weight:700;cursor:pointer;touch-action:manipulation;
  transition:background .15s,transform .1s;
}
.btn-primary:hover:not(:disabled){background:var(--accent-2)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.48;cursor:not-allowed}
.btn-ghost{
  min-height:46px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);
  font-size:13.5px;font-weight:700;cursor:pointer;touch-action:manipulation;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
}
.btn-ghost:hover{border-color:var(--nurse)}
.reveal-box{width:100%;border-style:dashed;border-color:var(--accent);color:var(--accent)}

/* ---------- 振り返り画面 ---------- */
.summary-card{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);max-width:780px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
}
.summary-title{margin:0;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.rec-list{display:flex;flex-direction:column;gap:7px}
.rec-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line);
  font-size:13.5px;
}

/* ---------- フッター ---------- */
.foot{
  max-width:1160px;margin:0 auto;
  padding:10px var(--gut-r) 24px var(--gut-l);
  font-size:12px;color:var(--ink-3);text-align:center;
  border-top:1px solid var(--line);
}

/* ---------- SVG / CSS 動きのアニメーション ---------- */
@keyframes pinPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
@keyframes tremorShake{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(-2.2px,1px) rotate(-1.5deg)}
  50%{transform:translate(2.2px,-1px) rotate(1.5deg)}
  75%{transform:translate(-1.8px,-1px) rotate(-1deg)}
}
@keyframes sweatDrop{
  0%{opacity:0;transform:translateY(-4px)}
  35%{opacity:1;transform:translateY(0)}
  85%{opacity:1;transform:translateY(5px)}
  100%{opacity:0;transform:translateY(8px)}
}
@keyframes ringExpand{
  0%{opacity:.92;transform:scale(.92)}
  50%{opacity:1;transform:scale(1.06)}
  100%{opacity:.35;transform:scale(1.16)}
}
@keyframes stepLeftRight{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes fastChest{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.anim-tremor{transform-box:fill-box;transform-origin:center;animation:tremorShake .45s ease-in-out infinite}
.anim-sweat{transform-box:fill-box;transform-origin:center;animation:sweatDrop 1.8s ease-in-out infinite}
.anim-ring{transform-box:fill-box;transform-origin:center;animation:ringExpand 1.4s ease-in-out infinite}
.anim-step-l{transform-box:fill-box;transform-origin:center;animation:stepLeftRight .9s ease-in-out infinite}
.anim-step-r{transform-box:fill-box;transform-origin:center;animation:stepLeftRight .9s ease-in-out .45s infinite}
.anim-chest{transform-box:fill-box;transform-origin:center;animation:fastChest .95s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .diff-pin-core,.xfade-layer,.anim-tremor,.anim-sweat,.anim-ring,.anim-step-l,.anim-step-r,.anim-chest{
    animation:none!important;
  }
}

/* ---------- 全画面モード（html.is-max） ----------

html.is-max,html.is-max body{

html.is-max .spot-btn{min-height:44px;padding:0 8px;font-size:11px}

  /* ---------- アプリ状態 ---------- */
  var state = {
    idx: 0,
    view: 'play',       // 'play' | 'summary'
    sound: !!saved.sound,
    theme: saved.theme || '',
    isMax: false,
    viewMode: 'side',   // 'side'（2枚並べる） | 'xfade'（重ねてクロスフェード比較）
    showOptions: showOptions,
    round: null,
    rounds: {}         // 場面を行き来しても、途中の問いと回答を保持する

  function getSpec(sc) {
    return SCENE_SPECS[sc.id] || SCENE_SPECS['ileus'];
  }

  /* ---------- ステージ（昨日と今日の2枚見比べ＋間違い探し） ---------- */
  function renderStageHTML(sc, review) {
    var round = state.round;
    var spec = getSpec(sc);
    var spots = spec.spots || [];
    var foundCount = 0;
    for (var i = 0; i < spots.length; i++) {
      if (round.foundSpots[i]) foundCount++;
    }
    var allFound = foundCount >= spots.length;

    var yImg = IMG[sc.id + '_y'] || '';
    var tImg = IMG[sc.id + '_t'] || yImg;

    var pinsHTML = '';
    if (review && round.showHints) {
      pinsHTML = spots.map(function (sp, idx) {
        var found = !!round.foundSpots[idx];
        var active = round.activeSpot === idx;
        var cls = 'diff-pin' + (found ? ' is-found' : '') + (active ? ' is-active' : '');
        return (
          '<button type="button" class="' + cls + '" style="left:' + sp.x + '%;top:' + sp.y + '%" ' +
            'data-spot="' + idx + '" aria-label="変化ポイント ' + esc(sp.short) + '">' +
            '<span class="diff-pin-core">' + (found ? '✓' : '') + esc(sp.short) + '</span>' +
          '</button>'
        );
      }).join('');
    }

    var active = review && round.showHints ? spots[round.activeSpot] : null;
    var activeDetail = active ? active.detail : (sc.look || '');
    var subTag = active ? active.short : '今日の様子';

    var xfadeImg = state.viewMode === 'xfade'
      ? '<img class="xfade-layer" src="' + yImg + '" alt="昨日の様子（重ね合わせ比較）">'
      : '';

    return (
      '<div class="stage-card">' +
        '<div class="diff-bar">' +
          '<div class="diff-info">' +
            '<span class="diff-title">' + (review ? '🔍 解説図：昨日と今日の違い' : '🔍 昨日と今日の見比べ') + '</span>' +
            (review && round.showHints ? '<span class="diff-count ' + (allFound ? 'is-all' : '') + '">' +
              (allFound ? '✓ 変化 ' + foundCount + '/' + spots.length + ' 確認済' : '確認した変化 ' + foundCount + '/' + spots.length + '（印をタップ）') +
            '</span>' : '') +
          '</div>' +
          '<div class="diff-tools">' +
            '<button type="button" class="spot-btn ' + (state.viewMode === 'side' ? 'is-on' : '') + '" data-view-mode="side">🖼️ 2枚並べる</button>' +
            '<button type="button" class="spot-btn ' + (state.viewMode === 'xfade' ? 'is-on' : '') + '" data-view-mode="xfade">⇄ 重ねて比較</button>' +
            (review ? '<button type="button" class="spot-btn ' + (round.showHints ? 'is-on' : '') + '" id="btn-toggle-hints" aria-pressed="' + round.showHints + '">✨ 変化の印</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="stage-box">' +
          '<div class="compare-panels ' + (state.viewMode === 'xfade' ? 'is-xfade' : '') + '">' +
            /* 左：昨日の挿絵 */
            '<div class="illust-panel is-yest">' +
              '<span class="panel-tag is-yest">昨日（普段の様子）</span>' +
              '<span class="panel-metric">' + esc(spec.yMetric) + '</span>' +
              '<img class="scene-illust" src="' + yImg + '" alt="' + esc((sc.who && sc.who.name) || '') + 'の昨日の様子">' +
            '</div>' +
            /* 右：今日の挿絵＋SVG動き＋間違い探しピン */
            '<div class="illust-panel is-today">' +
              '<span class="panel-tag is-today">' + (state.viewMode === 'xfade' ? '昨日 ⇄ 今日（重ねて比較中）' : '今日（いつもと違う！）') + '</span>' +
              '<span class="panel-metric is-alert">' + esc(spec.tMetric) + '</span>' +
              '<img class="scene-illust" src="' + tImg + '" alt="' + esc((sc.who && sc.who.name) || '') + 'の今日の様子：' + esc(sc.look || '') + '">' +
              xfadeImg +
              (review && round.showHints && spec.svgOverlay ? spec.svgOverlay() : '') +
              pinsHTML +
            '</div>' +
          '</div>' +
          '<div class="stage-sub">' +
            '<div class="sub-chip ' + (active ? 'is-spot' : '') + '" aria-live="polite">' +
              '<span class="vol-tag">' + esc(subTag) + '</span>' +
              '<span>' + esc(activeDetail) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- 昨日と今日の観察記録・比較表（compare） ---------- */
  function renderCompareCardHTML(sc, review) {
    var rows = sc.compare || [];
    // 表の行順と絵の印の順は、場面によって異なる。
    var compareSpots = review && SCENE_SPECS[sc.id] ? SCENE_SPECS[sc.id].compareSpots : [];

    var trs = rows.map(function (r, idx) {
      var isSame = r.yesterday === r.today || /昨日と同じ/.test(r.today || '');
      var cls = 'compare-row' + (review && !isSame ? ' is-changed' : '');
      var badge = !review ? '' : isSame
        ? '<span class="chg-badge is-same">同じ</span>'
        : '<span class="chg-badge is-diff">変化</span>';
      var label = esc(r.label);
      if (compareSpots[idx] !== undefined) {
        label = '<button type="button" class="compare-jump" data-compare-spot="' + compareSpots[idx] + '">' + label + '</button>';
      }
      return (
        '<tr class="' + cls + '">' +
          '<th scope="row">' + label + '</th>' +
          '<td class="col-yest">昨日：' + esc(r.yesterday) + '</td>' +
          '<td class="col-today">' + badge + '今日：' + esc(r.today) + '</td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<div class="compare-card">' +
        '<div class="compare-head">' +
          '<span>📋 昨日と今日の観察記録</span>' +
        '</div>' +
        '<table class="compare-table" aria-label="昨日と今日の観察記録の比較">' +
          '<tbody>' + trs + '</tbody>' +
        '</table>' +
      '</div>'
    );
  }

  /* ---------- タイムライン描画 ---------- */
  function renderTimeline() {
    var nav = document.getElementById('timeline');
    if (!nav) return;
    var cleared = saved.cleared || {};
    nav.innerHTML = scenes.map(function (sc, i) {
      var done = cleared[sc.id];
      var cls = 'tl-item' + (state.view === 'play' && i === state.idx ? ' is-now' : '') + (done ? ' is-done' : '');
      return '<button type="button" class="' + cls + '" data-scene-idx="' + i + '">' +
        '<span class="tl-clock">' + esc(sc.time || '') + '</span>' +
        '<span>' + esc((sc.who && sc.who.name) || sc.place || '') + '</span>' +
        (done ? '<span>✓</span>' : '') +
      '</button>';
    }).join('');

    nav.querySelectorAll('[data-scene-idx]').forEach(function (b) {
      b.addEventListener('click', function () {
        initScene(Number(b.getAttribute('data-scene-idx')), false, true);
      });
    });
  }

  /* ---------- 先輩アイコン ---------- */
  function renderSenpaiAvatar() {
    if (IMG['senpai']) {
      return '<img src="' + IMG['senpai'] + '" alt="プリセプター（先輩ナース）">';
    }
    return '';
  }

  function renderOptions(question, order, picked, kind) {
    if (picked === null && !state.showOptions && !state.round.optionsRevealed) {
      return '<button type="button" id="reveal-options" class="btn-ghost reveal-box">選択肢を表示</button>';
    }
    return '<div class="opts">' + order.map(function (origIdx, dispIdx) {
      var cls = 'opt';
      if (picked !== null) {
        if (origIdx === 0) cls += ' is-ok';
        else if (origIdx === picked) cls += ' is-ng';
      }
      return '<button type="button" class="' + cls + '" data-' + kind + '="' + origIdx + '"' + (picked !== null ? ' disabled' : '') + '>' +
        '<span class="opt-num">' + (dispIdx + 1) + '</span><span>' + esc(question.a[origIdx]) + '</span></button>';
    }).join('') + '</div>';
  }

  function renderExplanation(question, picked) {
    if (picked === null) return '';
    var ok = picked === 0;
    return '<div class="exp ' + (ok ? 'is-ok' : 'is-ng') + '" tabindex="-1">' +
      '<div class="exp-head">' + (ok ? '✓ 正解！' : '正解は「' + esc(question.a[0]) + '」です。') + '</div>' +
      '<div>' + esc(question.why || '') + '</div>' +
      (question.src ? '<div class="exp-src">出典：' + esc(question.src) + '</div>' : '') +
      '</div>';
  }

  function recordAnswer(scene, question, step, picked) {
    var note = window.PG_NOTE;
    if (!note) return;
    var attempt = { app: D.title, id: [scene.id, step], q: question.q };
    if (picked === 0) note.hit(attempt);
    else note.miss(Object.assign(attempt, {
      picked: question.a[picked],
      answer: question.a[0],
      why: question.why,
      options: question.a,
      context: step === 'exam' ? '' : [scene.place, scene.look].join('\n')
    }));
  }

  /* ---------- 右ペイン（設問・先輩・試験おまけ） ---------- */
  function renderRightPaneHTML(sc, review) {
    var round = state.round;
    var qs = sc.qs || [];
    var step1Cls = 'step-tag' + (!round.wrapStep && round.qIndex === 0 ? ' is-on' : ' is-done');
    var step2Cls = 'step-tag' + (round.wrapStep ? ' is-done' : (round.qIndex === 1 ? ' is-on' : ''));
    var step3Cls = 'step-tag' + (round.wrapStep ? ' is-on' : '');

    var tabs =
      '<div class="step-tabs">' +
        '<span class="' + step1Cls + '">① 違いから見抜く</span>' +
        (qs.length > 1 ? '<span class="' + step2Cls + '">② 最初の動き方</span>' : '') +
        '<span class="' + step3Cls + '">③ 試験おまけ・振り返り</span>' +
      '</div>';

    if (!round.wrapStep) {
      var qObj = qs[round.qIndex];
      if (!qObj) {
        return tabs + '<div class="right-scroll"><p>この場面の設問はありません。</p></div>';
      }
      var nextLabel = round.qIndex + 1 < qs.length
        ? '次の問い（最初の対応）へ →'
        : (sc.exam ? '試験おまけへ →' : 'この場面の振り返りへ →');

      return (
        tabs +
        '<div class="right-scroll">' +
          '<h2 class="q-title" tabindex="-1">' + esc(qObj.q) + '</h2>' +
          renderOptions(qObj, round.qOrder, round.qPicked, 'opt') +
          renderExplanation(qObj, round.qPicked) +
        '</div>' +
        '<div class="act-row">' +
          '<button type="button" id="btn-next-q" class="btn-primary"' + (round.qPicked === null ? ' disabled' : '') + '>' + nextLabel + '</button>' +
        '</div>'
      );
    }

    /* フェーズ 3: 先輩のひとこと ＋ おまけ「試験ならこう問われる」 */
    var ex = sc.exam;
    var exHTML = '';
    if (ex && !round.examSkipped) {
      exHTML =
        '<div><span class="exam-badge">おまけ・試験ならこう問われる（' + esc(ex.kind || '国試') + '）</span></div>' +
        '<h2 class="q-title" tabindex="-1">' + esc(ex.q) + '</h2>' +
        renderOptions(ex, round.examOrder, round.examPicked, 'exam') +
        renderExplanation(ex, round.examPicked);
    }

    var isLast = state.idx + 1 >= scenes.length;
    return (
      tabs +
      '<div class="right-scroll">' +
        exHTML +
        (review ? '<div class="senpai-box" tabindex="-1">' +
          '<div class="senpai-av">' + renderSenpaiAvatar() + '</div>' +
          '<div class="senpai-body">' +
            '<div class="senpai-name">プリセプター（先輩ナース）</div>' +
            '<div>' + esc(sc.senpai || '昨日との違いを具体的な観察と言葉で伝えよう。') + '</div>' +
          '</div>' +
        '</div>' : '') +
      '</div>' +
      '<div class="act-row">' +
        (review ? '<button type="button" id="btn-scene-next" class="btn-primary">' +
          (isLast ? '全体の振り返りを見る →' : '次の場面（' + esc(scenes[state.idx + 1].time || '') + ' ' + esc((scenes[state.idx + 1].who && scenes[state.idx + 1].who.name) || '') + '）へ →') +
        '</button>' : '<button type="button" id="btn-skip-exam" class="btn-ghost">試験を飛ばして振り返る</button>') +
      '</div>'
    );
  }

  /* ---------- 振り返り画面 ---------- */
  function renderSummary() {
    var rows = scenes.map(function (sc, i) {
      return '<div class="rec-item">' +
        '<div><b>' + esc(sc.time) + ' ' + esc(sc.place) + '</b> — ' + esc((sc.who && sc.who.name) || '') + '（' + esc((sc.who && sc.who.dx) || '') + '）</div>' +
        '<button type="button" class="btn-ghost" style="min-height:44px;padding:0 12px" data-retry="' + i + '">見直す</button>' +
      '</div>';
    }).join('');

    var runnerUrl = (D.links && D.links[0] && D.links[0].url) || 'https://claude.ai/artifact/TnapYeCmWL3aiAAXwVy9rN';
    var runnerLbl = (D.links && D.links[0] && D.links[0].label) || '医師版「副作用ランナー」';

    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="summary-card">' +

        '<div class="senpai-box">' +
          '<div class="senpai-av">' + renderSenpaiAvatar() + '</div>' +
          '<div class="senpai-body">' +
            '<div class="senpai-name">プリセプター（先輩ナース）</div>' +
            '<div>「昨日と何が違うか」を見たまま・測ったままに捉え、薬が増えた時期や拘束・食事量と結びつけて医師へ早く伝えることで、重い副作用や急変から患者さんを守れるよ。</div>' +
          '</div>' +
        '</div>' +
        '<div class="rec-list">' + rows + '</div>' +
        '<div class="act-row">' +
          '<button type="button" id="btn-restart" class="btn-primary">最初からもう一度練習する</button>' +

        '</div>' +

    app.querySelectorAll('[data-retry]').forEach(function (b) {
      b.addEventListener('click', function () { initScene(Number(b.getAttribute('data-retry')), true, true); });
    });
    var re = document.getElementById('btn-restart');
    if (re) re.addEventListener('click', function () { state.rounds = {}; initScene(0, false, true); });
  }

  /* ---------- テーマ適用 ---------- */
  function applyTheme() {
    if (state.theme === 'dark' || state.theme === 'light') {
      document.documentElement.setAttribute('data-theme', state.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    var btn = document.getElementById('themebtn');
    if (btn) {
      var dark = state.theme === 'dark' || (!state.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
      btn.textContent = dark ? '☀' : '☾';
      btn.title = dark ? '明るい画面に切り替え' : '暗い画面に切り替え';
      btn.setAttribute('aria-label', btn.title);
    }
  }

  /* ---------- 全画面（⛶ 全画面） ---------- */
  function syncMaxBtn() {
    var btn = document.getElementById('maxbtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', state.isMax ? 'true' : 'false');
    btn.innerHTML = state.isMax ? '✕ <span class="lbl-sm">終了</span>' : '⛶ <span class="lbl-sm">全画面</span>';
  }
  function setMax(on) {
    state.isMax = !!on;
    document.documentElement.classList.toggle('is-max', state.isMax);
    syncMaxBtn();
  }
  function toggleFullscreen() {
    var want = !state.isMax;
    setMax(want);
    try {
      var el = document.documentElement;
      if (want) {
        if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
        else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { /* iPhone Safari は class だけで動作 */ }
  }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && state.isMax) setMax(false);
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (!document.webkitFullscreenElement && state.isMax) setMax(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key === 'Escape' && state.isMax) {
      toggleFullscreen();
      return;
    }
    if (state.view !== 'play' || e.repeat || e.target.closest('input, textarea, select, [contenteditable]')) return;
    var reveal = document.getElementById('reveal-options');
    if (reveal && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('button, a, summary')) {
      e.preventDefault();
      reveal.click();
    } else if (/^[1-9]$/.test(e.key)) {
      var option = document.querySelectorAll('#app .opts .opt')[Number(e.key) - 1];
      if (option && !option.disabled) {
        e.preventDefault();
        option.click();
      }
    }
  });

  /* ---------- 場面初期化 ---------- */
  function initScene(i, restart, focus) {
    state.idx = i;
    state.view = 'play';
    var sc = scenes[i];
    if (sc && (restart || !state.rounds[i])) {
      var qs = sc.qs || [];
      state.rounds[i] = {
        activeSpot: null,
        foundSpots: {},
        showHints: true,
        qIndex: 0,
        qPicked: null,
        qOrder: qs.length ? shuffleIdx(qs[0].a.length, i * 23 + 7) : [],
        optionsRevealed: false,
        wrapStep: qs.length === 0,
        examOrder: sc.exam ? shuffleIdx(sc.exam.a.length, i * 43 + 11) : [],
        examPicked: null,
        examSkipped: false
      };
    }
    state.round = state.rounds[i];
    if (focus) renderAndFocus('.q-title, .senpai-box, .summary-title');
    else render();
  }

  function renderAndFocus(selector) {
    render();
    var target = document.querySelector(selector);
    if (target) target.focus();
  }

  /* ---------- メイン描画 ---------- */
  function render() {
    renderTimeline();
    var app = document.getElementById('app');
    if (!app) return;

    if (state.view === 'summary' || !scenes.length) {
      renderSummary();
      return;
    }

    var sc = scenes[state.idx];
    var round = state.round;
    var review = round.wrapStep && (!sc.exam || round.examPicked !== null || round.examSkipped);
    var who = sc.who || {};
    var keysHTML = (who.key || []).map(function (k) {
      return '<span class="key-chip">' + esc(k) + '</span>';
    }).join('');

    app.innerHTML =
      '<div class="play-grid">' +
        '<div class="left-pane">' +
          '<div class="chart-strip">' +
            '<span class="time-badge">🕒 ' + esc(sc.time || '') + '</span>' +
            '<span class="place-badge">' + esc(sc.place || '') + '</span>' +
            '<span class="who-main">' + esc(who.name || '') + '（' + esc(who.age || '') + '歳・' + esc(who.sex || '') + '）</span>' +
            '<span class="who-dx">' + esc(who.dx || '') + '</span>' +
            (keysHTML ? '<div class="who-keys">' + keysHTML + '</div>' : '') +
          '</div>' +
          renderStageHTML(sc, review) +
          renderCompareCardHTML(sc, review) +
        '</div>' +
        '<div class="right-pane">' +
          renderRightPaneHTML(sc, review) +
        '</div>' +
      '</div>';

    var reveal = document.getElementById('reveal-options');
    if (reveal) {
      reveal.addEventListener('click', function () {
        round.optionsRevealed = true;
        renderAndFocus('#app .opts .opt');
      });
    }

    /* 図の操作で問いと解説のスクロール位置を動かさない。 */
    var left = app.querySelector('.left-pane');
    left.addEventListener('click', function (e) {
      var control = e.target.closest('[data-view-mode], #btn-toggle-hints, [data-spot], [data-compare-spot]');
      if (!control) return;
      var mode = control.getAttribute('data-view-mode');
      var compareSpot = control.getAttribute('data-compare-spot');
      var spot = compareSpot === null ? control.getAttribute('data-spot') : compareSpot;
      var selector = '#btn-toggle-hints';
      if (mode) {
        state.viewMode = mode;
        selector = '[data-view-mode="' + mode + '"]';
      } else if (spot !== null) {
        round.showHints = true;
        round.activeSpot = Number(spot);
        round.foundSpots[spot] = true;
        selector = '[data-spot="' + spot + '"]';
      } else {
        round.showHints = !round.showHints;
      }
      sfxTap();
      var keepFocus = control === document.activeElement;
      left.querySelector('.stage-card').outerHTML = renderStageHTML(sc, review);
      if (compareSpot !== null) left.querySelector(selector).focus();
      else if (keepFocus) left.querySelector(selector).focus({ preventScroll: true });
    });

    /* 設問の選択肢イベント */
    app.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (round.qPicked !== null) return;
        var origIdx = Number(b.getAttribute('data-opt'));
        round.qPicked = origIdx;
        recordAnswer(sc, sc.qs[round.qIndex], round.qIndex, origIdx);
        if (origIdx === 0) sfxOk(); else sfxNg();
        renderAndFocus('#app .exp');
      });
    });

    var btnNextQ = document.getElementById('btn-next-q');
    if (btnNextQ) {
      btnNextQ.addEventListener('click', function () {
        if (round.qPicked === null) return;
        var qs = sc.qs || [];
        round.optionsRevealed = false;
        if (round.qIndex + 1 < qs.length) {
          round.qIndex++;
          round.qPicked = null;
          round.qOrder = shuffleIdx(qs[round.qIndex].a.length, state.idx * 23 + round.qIndex * 17 + 7);
        } else {
          round.wrapStep = true;
        }
        renderAndFocus('.q-title, .senpai-box');
      });
    }

    /* おまけ試験問題 */
    app.querySelectorAll('[data-exam]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (round.examPicked !== null || round.examSkipped) return;
        var origIdx = Number(b.getAttribute('data-exam'));
        round.examPicked = origIdx;
        recordAnswer(sc, sc.exam, 'exam', origIdx);
        if (origIdx === 0) sfxOk(); else sfxNg();
        renderAndFocus('#app .exp');
      });
    });

    var skipExam = document.getElementById('btn-skip-exam');
    if (skipExam) {
      skipExam.addEventListener('click', function () {
        round.examSkipped = true;
        renderAndFocus('.senpai-box');
      });
    }

    /* 次の場面へ */
    var btnSceneNext = document.getElementById('btn-scene-next');
    if (btnSceneNext) {
      btnSceneNext.addEventListener('click', function () {
        var cleared = saved.cleared || {};
        cleared[sc.id] = true;
        saved.cleared = cleared;
        writeSave({ cleared: cleared });

        if (state.idx + 1 < scenes.length) {
          initScene(state.idx + 1, false, true);
        } else {
          state.view = 'summary';
          renderAndFocus('.summary-title');
        }
      });
    }
  }

  /* ---------- 初期化 ---------- */
  function boot() {
    var wardEl = document.getElementById('ward-name');
    if (wardEl && D.ward && D.ward.name) wardEl.textContent = D.ward.name;

    var runnerEl = document.getElementById('runner-link');
    if (runnerEl && D.links && D.links[0]) {
      runnerEl.href = D.links[0].url;
      runnerEl.textContent = '🏃 ' + D.links[0].label;
    }

    var themeBtn = document.getElementById('themebtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var curDark = state.theme === 'dark' || (!state.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
        state.theme = curDark ? 'light' : 'dark';
        writeSave({ theme: state.theme });
        applyTheme();
      });
    }

    var soundBtn = document.getElementById('soundbtn');
    if (soundBtn) {
      function syncSound() {
        soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
        soundBtn.innerHTML = state.sound ? '🔊 <span class="lbl-sm">音オン</span>' : '🔇 <span class="lbl-sm">音オフ</span>';
      }
      syncSound();
      soundBtn.addEventListener('click', function () {
        state.sound = !state.sound;
        writeSave({ sound: state.sound });
        syncSound();
        if (state.sound) playTone(660, 0.1, 'sine', 0.04);
      });
    }

    var maxBtn = document.getElementById('maxbtn');
    if (maxBtn) maxBtn.addEventListener('click', toggleFullscreen);

    var optionsBtn = document.getElementById('optionsbtn');
    if (optionsBtn) {
      optionsBtn.setAttribute('aria-pressed', state.showOptions);
      optionsBtn.addEventListener('click', function () {
        state.showOptions = !state.showOptions;
        optionsBtn.setAttribute('aria-pressed', state.showOptions);
        try { localStorage.setItem(SHOW_OPTIONS_KEY, String(state.showOptions)); } catch (e) { /* 保存できない環境でも動作 */ }
        render();
      });
    }

    applyTheme();
    syncMaxBtn();
    initScene(0);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
