<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>はじめての夜勤｜精神科ナースのお仕事</title>
<meta name="description" content="新人看護師のための精神科病棟夜勤巡視トレーニング。暗い病棟を懐中電灯で照らし、観察と判断、当直医へのSBAR報告を練習する。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* はじめての夜勤（精神科ナースのお仕事）
   方針：紙の色の背景と落ち着いた病院の青磁色、夜勤巡視の深い藍色、懐中電灯の温かい光。
   全画面（html.is-max）で1場面がページ全体をスクロールせずに収まる設計。 */
:root{
  --bg:#E8EDEB;--paper:#FFFFFF;--paper-2:#F2F6F4;--paper-3:#E5ECE9;
  --ink:#141E1C;--ink-2:#3C4A47;--ink-3:#54635F;
  --line:#CFDAD6;--line-strong:#9EAEA9;
  --accent:#2744D1;--accent-2:#1E36AE;--accent-soft:#E5EAFB;--on-accent:#FFFFFF;
  --nurse:#0C766A;--nurse-2:#095B51;--nurse-soft:#DEF3EF;
  --night:#0D1628;--night-2:#15233D;--night-ink:#EBF2FA;--night-sub:#9CB2CC;
  --beam:#FFF2B8;--amber:#C67A08;--amber-soft:#FFF3D6;
  --ok:#127844;--ok-soft:#E0F3E8;--ng:#BF3325;--ng-soft:#FDEAE8;
  --f-display:"DotGothic16","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut-l:max(12px,env(safe-area-inset-left,0px));
  --gut-r:max(12px,env(safe-area-inset-right,0px));
  --shadow:0 1px 2px rgba(16,24,22,.06),0 6px 18px rgba(16,24,22,.07);
  --radius:14px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513;--paper:#17211F;--paper-2:#202D2A;--paper-3:#283734;
    --ink:#ECF2F0;--ink-2:#C1CECA;--ink-3:#99AAA5;
    --line:#2D3C39;--line-strong:#4D615B;
    --accent:#8CA2FF;--accent-2:#A8B8FF;--accent-soft:#1D2754;--on-accent:#0B102E;
    --nurse:#4FD1C0;--nurse-2:#76E0D2;--nurse-soft:#123833;
    --amber:#F2B84B;--amber-soft:#382A0E;
    --ok:#5FD493;--ok-soft:#163322;--ng:#FF8C7E;--ng-soft:#3D1E1B;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513;--paper:#17211F;--paper-2:#202D2A;--paper-3:#283734;
  --ink:#ECF2F0;--ink-2:#C1CECA;--ink-3:#99AAA5;
  --line:#2D3C39;--line-strong:#4D615B;
  --accent:#8CA2FF;--accent-2:#A8B8FF;--accent-soft:#1D2754;--on-accent:#0B102E;
  --nurse:#4FD1C0;--nurse-2:#76E0D2;--nurse-soft:#123833;
  --amber:#F2B84B;--amber-soft:#382A0E;
  --ok:#5FD493;--ok-soft:#163322;--ng:#FF8C7E;--ng-soft:#3D1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.32);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.65;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 相互リンク帯 ---------- */
.sister-bar{
  background:var(--paper-2);border-bottom:1px solid var(--line);
  font-size:12.5px;
}
.sister-in{
  max-width:1120px;margin:0 auto;
  padding:4px var(--gut-r) 4px var(--gut-l);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.sister-link{
  display:inline-flex;align-items:center;gap:4px;
  min-height:36px;padding:2px 6px;border-radius:8px;
  text-decoration:none;font-weight:700;color:var(--accent);
}
.sister-link:hover{background:var(--accent-soft)}
.ward-pill{
  font-size:11.5px;color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;
}

/* ---------- 上部バー ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1120px;margin:0 auto;
  padding:6px var(--gut-r) 6px var(--gut-l);
  min-height:56px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
}
.brand{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;
  font-family:var(--f-display);font-size:18px;letter-spacing:.02em;
  color:var(--ink);text-decoration:none;white-space:nowrap;min-width:0;
}
.brand-ic{
  width:28px;height:28px;border-radius:8px;flex:none;
  display:grid;place-items:center;background:var(--night);color:var(--beam);
  font-size:15px;
}
.brand b{font-weight:inherit;color:var(--nurse)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.tbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:44px;min-width:44px;padding:0 11px;border-radius:999px;
  border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s;
}
.tbtn:hover{border-color:var(--nurse)}
.tbtn:active{transform:scale(.96)}
.tbtn[aria-pressed="true"]{background:var(--nurse);border-color:var(--nurse);color:#fff}
.tbtn-max{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tbtn-max:hover{background:var(--accent);color:var(--on-accent)}
.tbtn-icon{width:44px;padding:0}
@media (max-width:480px){
  .brand{font-size:15.5px}
  .tbtn{padding:0 9px;font-size:12px}
  .lbl-sm{display:none}
}

/* ---------- メイン領域 ---------- */
.wrap{
  max-width:1120px;margin:0 auto;
  padding:12px var(--gut-r) 24px var(--gut-l);
}

/* 進捗タイムライン */
.timeline{
  display:flex;align-items:center;gap:6px;overflow-x:auto;
  padding:2px 0 8px;margin-bottom:8px;scrollbar-width:thin;
}
.tl-item{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  min-height:44px;padding:0 12px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);
  font-size:12.5px;font-weight:700;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.tl-item:hover{border-color:var(--nurse)}
.tl-item.is-now{
  background:var(--night);border-color:var(--night);color:var(--beam);
}
.tl-item.is-done{
  background:var(--ok-soft);border-color:var(--ok);color:var(--ok);
}
.tl-clock{font-family:var(--f-mono);font-size:12px}

/* ---------- ステージと設問の2列レイアウト ---------- */
.play-grid{
  display:grid;grid-template-columns:1fr;gap:12px;align-items:start;
}
@media (min-width:900px){
  .play-grid{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:14px}
}

/* 左ペイン：患者カード＋暗い病棟ステージ */
.left-pane{display:flex;flex-direction:column;gap:8px;min-width:0}

.chart-strip{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  box-shadow:var(--shadow);
}
.time-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;background:var(--night);color:var(--beam);
  font-family:var(--f-mono);font-size:13px;font-weight:700;
}
.place-badge{
  font-size:12.5px;font-weight:700;color:var(--nurse);
  background:var(--nurse-soft);padding:3px 9px;border-radius:8px;
}
.who-main{font-weight:700;font-size:14.5px;color:var(--ink)}
.who-dx{font-size:12.5px;color:var(--ink-2)}
.who-keys{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.key-chip{
  font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);
}

/* 懐中電灯ステージ */
.stage-card{
  background:var(--night);border:1.5px solid #243554;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);position:relative;
}
.stage-box{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#070d1a;touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:crosshair;overflow:hidden;
}
.stage-box svg{display:block;width:100%;height:100%}

.stage-hud{
  position:absolute;top:8px;left:8px;right:8px;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  pointer-events:none;z-index:4;
}
.hud-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;
  background:rgba(9,15,28,.82);border:1px solid rgba(255,242,184,.35);
  color:var(--night-ink);font-size:12px;font-weight:700;
  backdrop-filter:blur(4px);
}
.hud-pill b{color:var(--beam)}

.stage-sub{
  position:absolute;left:10px;right:10px;bottom:8px;z-index:4;
  pointer-events:none;display:flex;justify-content:center;
}
.sub-chip{
  background:rgba(8,13,24,.88);border:1px solid rgba(255,242,184,.45);
  color:#FFF9DE;padding:5px 12px;border-radius:10px;
  font-size:12.5px;font-weight:700;text-align:center;
  max-width:100%;box-shadow:0 4px 14px rgba(0,0,0,.4);
}

.stage-bar{
  background:var(--night-2);border-top:1px solid #243554;
  padding:7px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.spot-btn{
  min-height:44px;padding:0 10px;border-radius:10px;
  border:1.5px solid #354b75;background:#1a2b49;color:var(--night-ink);
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;touch-action:manipulation;
  transition:all .15s;
}
.spot-btn:hover{border-color:var(--beam)}
.spot-btn.is-found{background:#183a36;border-color:#4fd1c0;color:#d9fff8}
.spot-btn.is-light{margin-left:auto;background:#2a2515;border-color:#d4a73b;color:var(--beam)}
.spot-btn.is-light[aria-pressed="true"]{background:var(--beam);color:#141a26;border-color:var(--beam)}

.look-box{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:9px 12px;font-size:13.5px;color:var(--ink);
}
.look-label{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;color:var(--amber);
  background:var(--amber-soft);padding:2px 8px;border-radius:999px;margin-right:6px;
}

/* 右ペイン：問い・選択肢・SBAR・先輩・試験 */
.right-pane{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);min-width:0;
  display:flex;flex-direction:column;gap:10px;
}
.step-tabs{
  display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;
}
.step-tag{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--paper-2);color:var(--ink-3);border:1px solid var(--line);
}
.step-tag.is-on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.step-tag.is-done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

.q-title{
  margin:0;font-family:var(--f-display);font-size:17px;line-height:1.45;color:var(--ink);
}
.q-sub{margin:0;font-size:13px;color:var(--ink-2)}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  width:100%;min-height:46px;padding:9px 12px;border-radius:11px;
  border:1.5px solid var(--line-strong);background:var(--paper-2);
  color:var(--ink);text-align:left;font-size:14px;line-height:1.45;
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;
  touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt-num{
  flex:none;width:24px;height:24px;border-radius:7px;margin-top:1px;
  background:var(--paper);border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);
}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.is-ok .opt-num{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ink)}
.opt.is-ng .opt-num{background:var(--ng);border-color:var(--ng);color:#fff}

/* 解説ボックス */
.exp{
  border-radius:12px;padding:10px 12px;border:1.5px solid var(--line);
  background:var(--paper-2);font-size:13.5px;line-height:1.55;
}
.exp.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.exp.is-ng{border-color:var(--ng);background:var(--ng-soft)}
.exp-head{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.exp-src{margin-top:5px;font-size:11.5px;color:var(--ink-2)}

/* SBAR 組み立て */
.sbar-intro{font-size:13px;color:var(--ink-2);margin:0}
.sbar-grid{display:flex;flex-direction:column;gap:8px}
.sbar-row{
  border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;
  background:var(--paper-2);
}
.sbar-row.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.sbar-row.is-ng{border-color:var(--ng);background:var(--ng-soft)}
.sbar-hd{
  display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12.5px;font-weight:700;
}
.sbar-letter{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:13px;
}
.sbar-cards{display:flex;flex-direction:column;gap:5px}
.sbar-card{
  width:100%;min-height:44px;padding:7px 10px;border-radius:9px;
  border:1.5px solid var(--line-strong);background:var(--paper);
  text-align:left;font-size:13px;line-height:1.4;cursor:pointer;
  touch-action:manipulation;transition:all .14s;
}
.sbar-card:hover:not(:disabled){border-color:var(--accent)}
.sbar-card.is-sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sbar-card.is-ok{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.sbar-card.is-ng{border-color:var(--ng);background:var(--ng-soft)}
.sbar-preview{
  border-radius:10px;padding:8px 10px;background:var(--night);color:var(--night-ink);
  font-size:12.5px;line-height:1.5;border:1px solid #2c4066;
}
.sbar-preview b{color:var(--beam)}

/* 先輩のひとこと */
.senpai-box{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:var(--nurse-soft);border:1.5px solid var(--nurse);
}
.senpai-av{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;background:var(--paper);border:1.5px solid var(--nurse)}
.senpai-body{min-width:0;font-size:13.5px;line-height:1.5}
.senpai-name{font-size:11.5px;font-weight:700;color:var(--nurse);margin-bottom:2px}

.exam-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);
}

/* アクションボタン */
.act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn-primary{
  flex:1;min-height:46px;padding:0 16px;border-radius:12px;
  border:none;background:var(--accent);color:var(--on-accent);
  font-size:14.5px;font-weight:700;cursor:pointer;touch-action:manipulation;
  transition:background .15s,transform .1s;
}
.btn-primary:hover:not(:disabled){background:var(--accent-2)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.48;cursor:not-allowed}
.btn-ghost{
  min-height:46px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);
  font-size:13.5px;font-weight:700;cursor:pointer;touch-action:manipulation;
}
.btn-ghost:hover{border-color:var(--nurse)}

/* ---------- 振り返り画面 ---------- */
.summary-card{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
}
.summary-title{margin:0;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score-box{
  background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;
  padding:10px;text-align:center;
}
.score-num{font-family:var(--f-display);font-size:22px;color:var(--nurse)}
.score-lbl{font-size:12px;color:var(--ink-2)}
.rec-list{display:flex;flex-direction:column;gap:7px}
.rec-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line);
  font-size:13.5px;
}

/* ---------- フッター ---------- */
.foot{
  max-width:1120px;margin:0 auto;
  padding:10px var(--gut-r) 24px var(--gut-l);
  font-size:12px;color:var(--ink-3);text-align:center;
  border-top:1px solid var(--line);
}

/* ---------- SVG アニメーション（なめらかなイージング） ---------- */
@keyframes chestBreath{
  0%,100%{transform:translateY(0) scaleY(1)}
  45%{transform:translateY(-3.2px) scaleY(1.028)}
}
@keyframes apneaCycle{
  0%,16%{transform:translateY(0) scaleY(1)}
  8%{transform:translateY(-3.5px) scaleY(1.03)}
  24%{transform:translateY(-2.4px) scaleY(1.02)}
  34%,100%{transform:translateY(0) scaleY(1)}
}
@keyframes snoreWave{
  0%,32%{opacity:.95;transform:translate(0,0)}
  16%{opacity:1;transform:translate(3px,-4px)}
  36%,100%{opacity:0;transform:translate(6px,-6px)}
}
@keyframes silentWarn{
  0%,36%{opacity:0}
  44%,92%{opacity:1}
  100%{opacity:0}
}
@keyframes sweatSlide{
  0%{transform:translateY(0);opacity:0}
  20%{opacity:.95}
  85%{opacity:.85}
  100%{transform:translateY(11px);opacity:0}
}
@keyframes rigidPulse{
  0%,100%{opacity:.35;transform:scale(1)}
  50%{opacity:.85;transform:scale(1.04)}
}
@keyframes paceSway{
  0%,100%{transform:translateX(-14px)}
  50%{transform:translateX(18px)}
}
@keyframes curtainSway{
  0%,100%{transform:skewX(0deg)}
  50%{transform:skewX(4deg)}
}
@keyframes climbRock{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(-3.5deg)}
}
@keyframes dripFall{
  0%{transform:translateY(0);opacity:.9}
  80%{opacity:.8}
  100%{transform:translateY(18px);opacity:0}
}
@keyframes spotPulse{

.anim-breath{transform-origin:330px 230px;animation:chestBreath 3.6s ease-in-out infinite}
.anim-apnea{transform-origin:330px 230px;animation:apneaCycle 7.2s ease-in-out infinite}

.anim-rigid{transform-origin:center;animation:rigidPulse 2.2s ease-in-out infinite}
.anim-pace{animation:paceSway 6.4s ease-in-out infinite}
.anim-curtain{transform-origin:520px 60px;animation:curtainSway 4.8s ease-in-out infinite}
.anim-climb{transform-origin:340px 220px;animation:climbRock 3.2s ease-in-out infinite}
.anim-drip{animation:dripFall 1.8s ease-in infinite}
.spot-ring{transform-box:fill-box;transform-origin:center;animation:spotPulse 2.2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .anim-breath,.anim-apnea,.anim-snore,.anim-silent,.anim-sweat,.anim-sweat-2,
  .anim-rigid,.anim-pace,.anim-curtain,.anim-climb,.anim-drip,.spot-ring{

  }
}

    activeSpot: null,  // 現在表示中の観察メモ
    qIndex: 0,
    qPicked: null,
    qOrder: [],
    sbarStep: false,   // SBARフェーズ中か
    sbarOrder: null,   // { S:[], B:[], A:[], R:[] }
    sbarPicked: {},    // { S: origIdx, ... }
    sbarDone: false,
    wrapStep: false,   // 先輩＆試験おまけフェーズか
    examOrder: [],
    examPicked: null,
    results: {}        // { sceneIdx: { qOk, qTot, sbarOk, examOk } }
  };

  /* ---------- テーマ適用 ---------- */
  function applyTheme() {
    if (state.theme === 'dark' || state.theme === 'light') {
      document.documentElement.setAttribute('data-theme', state.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    var btn = document.getElementById('themebtn');
    if (btn) {
      var dark = state.theme === 'dark' || (!state.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
      btn.textContent = dark ? '☀' : '☾';
      btn.title = dark ? '明るい画面に切り替え' : '暗い画面に切り替え';
      btn.setAttribute('aria-label', btn.title);
    }
  }

  /* ---------- 全画面（⛶ 全画面） ---------- */
  function syncMaxBtn() {
    var btn = document.getElementById('maxbtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', state.isMax ? 'true' : 'false');
    btn.innerHTML = state.isMax ? '✕ <span class="lbl-sm">終了</span>' : '⛶ <span class="lbl-sm">全画面</span>';
  }
  function setMax(on) {
    state.isMax = !!on;
    document.documentElement.classList.toggle('is-max', state.isMax);
    syncMaxBtn();
  }
  function toggleFullscreen() {
    var want = !state.isMax;
    setMax(want);
    try {
      var el = document.documentElement;
      if (want) {
        if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
        else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { /* iPhone Safari は class だけで動作 */ }
  }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && state.isMax) setMax(false);
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (!document.webkitFullscreenElement && state.isMax) setMax(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.isMax) setMax(false);
  });

  /* ---------- 場面初期化 ---------- */
  function initScene(i) {
    state.idx = i;
    state.view = 'play';
    state.lightAll = false;
    state.activeSpot = null;
    state.qIndex = 0;
    state.qPicked = null;
    state.sbarStep = false;
    state.sbarPicked = {};
    state.sbarDone = false;
    state.wrapStep = false;
    state.examPicked = null;

    var sc = scenes[i];
    if (!sc) return;
    var vis = buildSceneVisual(sc);
    state.beam = { x: vis.beamInit.x, y: vis.beamInit.y };

    var qs = sc.qs || [];
    state.qOrder = qs.length ? shuffleIdx((qs[0].a || []).length, i * 17 + 3) : [];
    if (sc.sbar) {
      state.sbarOrder = {
        S: shuffleIdx((sc.sbar.S || []).length, i * 31 + 5),
        B: shuffleIdx((sc.sbar.B || []).length, i * 31 + 11),
        A: shuffleIdx((sc.sbar.A || []).length, i * 31 + 17),
        R: shuffleIdx((sc.sbar.R || []).length, i * 31 + 23)
      };
    } else {
      state.sbarOrder = null;
    }
    state.examOrder = sc.exam ? shuffleIdx((sc.exam.a || []).length, i * 43 + 7) : [];

    if (!state.results[i]) {
      state.results[i] = { qOk: 0, qTot: qs.length, sbarOk: null, examOk: null };
    }
    render();
  }

  /* ---------- 懐中電灯の移動（DOM直接更新で滑らかに） ---------- */
  function updateBeamDOM(vis) {
    var maskCircle = document.getElementById('beam-hole');
    var glowCircle = document.getElementById('beam-glow');
    var ringCircle = document.getElementById('beam-ring');
    var r = state.lightAll ? 680 : 122;
    if (maskCircle) {
      maskCircle.setAttribute('cx', state.beam.x.toFixed(1));
      maskCircle.setAttribute('cy', state.beam.y.toFixed(1));
      maskCircle.setAttribute('r', String(r));
    }
    if (glowCircle) {
      glowCircle.setAttribute('cx', state.beam.x.toFixed(1));
      glowCircle.setAttribute('cy', state.beam.y.toFixed(1));
      glowCircle.setAttribute('r', state.lightAll ? '0' : '128');
    }
    if (ringCircle) {
      ringCircle.setAttribute('cx', state.beam.x.toFixed(1));
      ringCircle.setAttribute('cy', state.beam.y.toFixed(1));
      ringCircle.setAttribute('opacity', state.lightAll ? '0' : '0.45');
    }
    /* スポット発見判定 */
    if (!vis || !vis.spots) return;
    if (!state.foundSpots[state.idx]) state.foundSpots[state.idx] = {};
    var changed = false;
    for (var s = 0; s < vis.spots.length; s++) {
      var sp = vis.spots[s];
      var dx = state.beam.x - sp.x;
      var dy = state.beam.y - sp.y;
      if (Math.sqrt(dx * dx + dy * dy) < 76) {
        if (!state.foundSpots[state.idx][s]) {
          state.foundSpots[state.idx][s] = true;
          state.activeSpot = sp;
          changed = true;
          sfxSpot();
        }
      }
    }
    if (changed) updateSpotChipsDOM(vis);
  }

  function updateSpotChipsDOM(vis) {
    var foundMap = state.foundSpots[state.idx] || {};
    var cnt = 0;
    vis.spots.forEach(function (sp, s) {
      if (foundMap[s]) cnt++;
      var b = document.getElementById('spot-btn-' + s);
      if (b) b.classList.toggle('is-found', !!foundMap[s]);
    });
    var hud = document.getElementById('hud-found');
    if (hud) hud.innerHTML = '🔦 観察 <b>' + cnt + '/' + vis.spots.length + '</b>';
    var sub = document.getElementById('stage-sub-txt');
    if (sub && state.activeSpot) {
      sub.textContent = '【' + state.activeSpot.label + '】' + state.activeSpot.detail;
    }
  }

  /* ---------- タイムライン描画 ---------- */
  function renderTimeline() {
    var el = document.getElementById('timeline');
    if (!el) return;
    var cleared = saved.cleared || {};
    el.innerHTML = scenes.map(function (sc, i) {
      var done = !!cleared[sc.id] || (state.results[i] && state.results[i].done);
      var cls = 'tl-item' + (state.view === 'play' && i === state.idx ? ' is-now' : done ? ' is-done' : '');
      return '<button type="button" class="' + cls + '" data-jump="' + i + '">' +
        '<span class="tl-clock">' + esc(sc.time || ('#' + (i + 1))) + '</span>' +
        '<span>' + esc(sc.place || '') + '</span>' +
        (done ? ' ✓' : '') +
        '</button>';
    }).join('');
    el.querySelectorAll('[data-jump]').forEach(function (b) {
      b.addEventListener('click', function () {
        initScene(Number(b.getAttribute('data-jump')));
      });
    });
  }

  /* ---------- ステージ描画 ---------- */
  function renderStageHTML(sc, vis) {
    var foundMap = state.foundSpots[state.idx] || {};
    var foundCount = Object.keys(foundMap).length;
    var r = state.lightAll ? 680 : 122;
    var subText = state.activeSpot
      ? '【' + state.activeSpot.label + '】' + state.activeSpot.detail
      : vis.subtitle;

    var spotMarks = vis.spots.map(function (sp, s) {
      var found = !!foundMap[s];
      return '<g class="spot-pin" data-spot="' + s + '" style="cursor:pointer">' +
        '<circle class="spot-ring" cx="' + sp.x + '" cy="' + sp.y + '" r="12" fill="none" stroke="' + (found ? '#4FD1C0' : '#FFE48A') + '" stroke-width="1.8"/>' +
        '<circle cx="' + sp.x + '" cy="' + sp.y + '" r="4.5" fill="' + (found ? '#4FD1C0' : '#FFF2B8') + '" stroke="#0D1628" stroke-width="1.6"/>' +
        '</g>';
    }).join('');

    var spotBtns = vis.spots.map(function (sp, s) {
      var found = !!foundMap[s];
      return '<button type="button" id="spot-btn-' + s + '" class="spot-btn' + (found ? ' is-found' : '') + '" data-focus-spot="' + s + '">' +
        (found ? '✓ ' : '🔦 ') + esc(sp.label) + '</button>';
    }).join('');

    return (
      '<div class="stage-card">' +
        '<div class="stage-box" id="stage-box" aria-label="暗い病室の巡視画面。指やマウスで懐中電灯を動かせます">' +
          '<div class="stage-hud">' +
            '<span class="hud-pill" id="hud-found">🔦 観察 <b>' + foundCount + '/' + vis.spots.length + '</b></span>' +
            '<span class="hud-pill">指・マウスで照らす</span>' +
          '</div>' +
          '<svg id="ward-svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(sc.vis || sc.look || '') + '">' +
            '<defs>' +
              '<linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="#0C172B"/><stop offset="100%" stop-color="#1C3152"/>' +
              '</linearGradient>' +
              '<linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="#5B78A8"/><stop offset="65%" stop-color="#D9A882"/><stop offset="100%" stop-color="#F6D8AE"/>' +
              '</linearGradient>' +
              '<radialGradient id="beamFade" cx="50%" cy="50%" r="50%">' +
                '<stop offset="0%" stop-color="#000000" stop-opacity="1"/>' +
                '<stop offset="68%" stop-color="#000000" stop-opacity="0.96"/>' +
                '<stop offset="100%" stop-color="#000000" stop-opacity="0"/>' +
              '</radialGradient>' +
              '<radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">' +
                '<stop offset="0%" stop-color="#FFF5C4" stop-opacity="0.22"/>' +
                '<stop offset="65%" stop-color="#FFF2B8" stop-opacity="0.08"/>' +
                '<stop offset="100%" stop-color="#FFF2B8" stop-opacity="0"/>' +
              '</radialGradient>' +
              '<mask id="beamMask">' +
                '<rect x="0" y="0" width="640" height="360" fill="#FFFFFF"/>' +
                '<circle id="beam-hole" cx="' + state.beam.x + '" cy="' + state.beam.y + '" r="' + r + '" fill="url(#beamFade)"/>' +
              '</mask>' +
            '</defs>' +
            vis.art +
            /* 暗い病棟の影オーバーレイ（懐中電灯の部分だけ透ける） */
            '<rect x="0" y="0" width="640" height="360" fill="#050A16" fill-opacity="' + (state.lightAll ? '0.24' : '0.88') + '" mask="url(#beamMask)" style="pointer-events:none"/>' +
            '<circle id="beam-glow" cx="' + state.beam.x + '" cy="' + state.beam.y + '" r="' + (state.lightAll ? '0' : '128') + '" fill="url(#beamGlow)" style="pointer-events:none"/>' +
            '<circle id="beam-ring" cx="' + state.beam.x + '" cy="' + state.beam.y + '" r="118" fill="none" stroke="#FFF2B8" stroke-width="1.2" stroke-dasharray="6 6" opacity="' + (state.lightAll ? '0' : '0.45') + '" style="pointer-events:none"/>' +
            spotMarks +
          '</svg>' +
          '<div class="stage-sub"><div class="sub-chip" id="stage-sub-txt">' + esc(subText) + '</div></div>' +
        '</div>' +
        '<div class="stage-bar">' +
          spotBtns +
          '<button type="button" id="light-toggle" class="spot-btn is-light" aria-pressed="' + (state.lightAll ? 'true' : 'false') + '">' +
            (state.lightAll ? '🔦 <span class="lbl-lit">電灯</span>' : '💡 <span class="lbl-lit">薄明かり</span>') +
          '</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- 右ペイン描画（設問 → SBAR → 先輩＆試験） ---------- */
  function renderRightPaneHTML(sc) {
    var hasSbar = !!sc.sbar;
    var step1Cls = 'step-tag' + (!state.sbarStep && !state.wrapStep ? ' is-on' : ' is-done');
    var step2Cls = 'step-tag' + (state.sbarStep ? ' is-on' : state.wrapStep ? ' is-done' : '');
    var step3Cls = 'step-tag' + (state.wrapStep ? ' is-on' : '');

    var tabs =
      '<div class="step-tabs">' +
        '<span class="' + step1Cls + '">1. 巡視の判断</span>' +
        (hasSbar ? '<span class="' + step2Cls + '">2. SBAR報告</span>' : '') +
        '<span class="' + step3Cls + '">' + (hasSbar ? '3' : '2') + '. 先輩・試験</span>' +
      '</div>';

    /* フェーズ 1: 設問 */
    if (!state.sbarStep && !state.wrapStep) {
      var qs = sc.qs || [];
      var qObj = qs[state.qIndex];
      if (!qObj) {
        return tabs + '<div class="right-scroll"><p>この場面の設問はありません。</p></div>';
      }
      var answered = state.qPicked !== null;
      var ok = state.qPicked === 0;
      var optsHTML = state.qOrder.map(function (origIdx, dispIdx) {
        var cls = 'opt';
        if (answered) {
          if (origIdx === 0) cls += ' is-ok';
          else if (origIdx === state.qPicked) cls += ' is-ng';
        }
        return '<button type="button" class="' + cls + '" data-opt="' + origIdx + '"' + (answered ? ' disabled' : '') + '>' +
          '<span class="opt-num">' + (dispIdx + 1) + '</span>' +
          '<span>' + esc(qObj.a[origIdx]) + '</span>' +
          '</button>';
      }).join('');

      var expHTML = '';
      if (answered) {
        expHTML =
          '<div class="exp ' + (ok ? 'is-ok' : 'is-ng') + '">' +
            '<div class="exp-head">' + (ok ? '✓ 正解！' : '△ もう一歩（正解は緑の選択肢）') + '</div>' +
            '<div>' + esc(qObj.why || '') + '</div>' +
            '<div class="exp-src">参考：' + esc(qObj.src || '院内の手順で確認') + '</div>' +
          '</div>';
      }

      var nextLabel = state.qIndex + 1 < qs.length
        ? '次の問いへ →'
        : hasSbar ? '当直医へ SBAR で報告する →' : '先輩のひとこと・試験へ →';

      return (
        tabs +
        '<div class="right-scroll">' +
          '<h2 class="q-title">' + esc(qObj.q) + '</h2>' +
          '<div class="opts">' + optsHTML + '</div>' +
          expHTML +
        '</div>' +
        '<div class="act-row">' +
          '<button type="button" id="btn-next-q" class="btn-primary"' + (answered ? '' : ' disabled') + '>' + nextLabel + '</button>' +
        '</div>'
      );
    }

    /* フェーズ 2: SBAR 組み立て */
    if (state.sbarStep && sc.sbar) {
      var meta = [
        ['S', '状況（Situation）', 'いま起きていること'],
        ['B', '背景（Background）', '経過・薬の変化'],
        ['A', '評価（Assessment）', '疑っていること'],
        ['R', '提案（Recommendation）', 'してほしいこと']
      ];
      var allPicked = meta.every(function (m) { return state.sbarPicked[m[0]] !== undefined; });
      var rowsHTML = meta.map(function (m) {
        var key = m[0];
        var list = sc.sbar[key] || [];
        var order = state.sbarOrder[key] || [];
        var picked = state.sbarPicked[key];
        var rowCls = 'sbar-row' + (state.sbarDone ? (picked === 0 ? ' is-ok' : ' is-ng') : '');
        var cards = order.map(function (origIdx) {
          var cCls = 'sbar-card';
          if (state.sbarDone) {
            if (origIdx === 0) cCls += ' is-ok';
            else if (origIdx === picked) cCls += ' is-ng';
          } else if (origIdx === picked) {
            cCls += ' is-sel';
          }
          return '<button type="button" class="' + cCls + '" data-sbar-k="' + key + '" data-sbar-i="' + origIdx + '"' + (state.sbarDone ? ' disabled' : '') + '>' +
            esc(list[origIdx]) + '</button>';
        }).join('');
        return '<div class="' + rowCls + '">' +
          '<div class="sbar-hd"><span class="sbar-letter">' + key + '</span><span>' + m[1] + '</span></div>' +
          '<div class="sbar-cards">' + cards + '</div>' +
        '</div>';
      }).join('');

      var previewLines = meta.map(function (m) {
        var idx = state.sbarPicked[m[0]];
        var txt = idx !== undefined ? sc.sbar[m[0]][idx] : '（札を選んでください）';
        return '<div><b>' + m[0] + ':</b> ' + esc(txt) + '</div>';
      }).join('');

      var sbarExp = '';
      if (state.sbarDone) {
        var sbarHits = meta.filter(function (m) { return state.sbarPicked[m[0]] === 0; }).length;
        sbarExp =
          '<div class="exp ' + (sbarHits === 4 ? 'is-ok' : 'is-ng') + '">' +
            '<div class="exp-head">' + (sbarHits === 4 ? '✓ SBAR ばっちり（4/4）' : 'SBAR の確認（' + sbarHits + '/4 正解）') + '</div>' +
            '<div>' + esc(sc.sbar.why || '') + '</div>' +
          '</div>';
      }

      return (
        tabs +
        '<div class="right-scroll">' +
          '<h2 class="q-title">当直医へ電話報告（SBAR を札で組み立て）</h2>' +
          sbarExp +
          '<div class="sbar-preview">' + previewLines + '</div>' +
          '<div class="sbar-grid">' + rowsHTML + '</div>' +
        '</div>' +
        '<div class="act-row">' +
          (!state.sbarDone
            ? '<button type="button" id="btn-sbar-go" class="btn-primary"' + (allPicked ? '' : ' disabled') + '>当直医へ報告する</button>'
            : '<button type="button" id="btn-sbar-next" class="btn-primary">先輩のひとこと・試験へ →</button>') +
        '</div>'
      );
    }

    /* フェーズ 3: 先輩のひとこと ＋ おまけ「試験ならこう問われる」 */
    var ex = sc.exam;
    var exAnswered = state.examPicked !== null;
    var exOk = state.examPicked === 0;
    var exHTML = '';
    if (ex) {
      var exOpts = state.examOrder.map(function (origIdx, dispIdx) {
        var cls = 'opt';
        if (exAnswered) {
          if (origIdx === 0) cls += ' is-ok';
          else if (origIdx === state.examPicked) cls += ' is-ng';
        }
        return '<button type="button" class="' + cls + '" data-exam="' + origIdx + '"' + (exAnswered ? ' disabled' : '') + '>' +
          '<span class="opt-num">' + (dispIdx + 1) + '</span>' +
          '<span>' + esc(ex.a[origIdx]) + '</span>' +
          '</button>';
      }).join('');

      exHTML =
        '<div><span class="exam-badge">おまけ・試験ならこう問われる（' + esc(ex.kind || '国試') + '）</span></div>' +
        '<h2 class="q-title">' + esc(ex.q) + '</h2>' +
        '<div class="opts">' + exOpts + '</div>' +
        (exAnswered
          ? '<div class="exp ' + (exOk ? 'is-ok' : 'is-ng') + '">' +
              '<div class="exp-head">' + (exOk ? '✓ 正解！' : '△ もう一歩（正解は緑の選択肢）') + '</div>' +
              '<div>' + esc(ex.why || '') + '</div>' +
            '</div>'
          : '');
    }

    var isLast = state.idx + 1 >= scenes.length;
    return (
      tabs +
      '<div class="right-scroll">' +
        '<div class="senpai-box">' +
          '<div class="senpai-av">' + SENPAI_SVG + '</div>' +
          '<div class="senpai-body">' +
            '<div class="senpai-name">プリセプター（先輩ナース）</div>' +
            '<div>' + esc(sc.senpai || '落ち着いて観察できたね。') + '</div>' +
          '</div>' +
        '</div>' +
        exHTML +
      '</div>' +
      '<div class="act-row">' +
        '<button type="button" id="btn-scene-next" class="btn-primary">' +
          (isLast ? '夜勤の振り返りを見る →' : '次の巡視（' + esc(scenes[state.idx + 1].time || '') + '）へ →') +
        '</button>' +
      '</div>'
    );
  }

  /* ---------- 振り返り画面 ---------- */
  function renderSummary() {
    var qOk = 0, qTot = 0, sbarOk = 0, sbarTot = 0, exOk = 0, exTot = 0;
    var rows = scenes.map(function (sc, i) {
      var r = state.results[i] || {};
      qOk += r.qOk || 0;
      qTot += (sc.qs || []).length;
      if (sc.sbar) { sbarTot++; if (r.sbarOk) sbarOk++; }
      if (sc.exam) { exTot++; if (r.examOk) exOk++; }
      return '<div class="rec-item">' +
        '<div><b>' + esc(sc.time) + ' ' + esc(sc.place) + '</b> — ' + esc((sc.who && sc.who.name) || '') + '</div>' +
        '<button type="button" class="btn-ghost" style="min-height:44px;padding:0 12px" data-retry="' + i + '">見直す</button>' +
      '</div>';
    }).join('');

    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="summary-card">' +
        '<h1 class="summary-title">夜勤おつかれさまでした！</h1>' +
        '<div class="score-grid">' +
          '<div class="score-box"><div class="score-num">' + qOk + '/' + qTot + '</div><div class="score-lbl">巡視の判断</div></div>' +
          '<div class="score-box"><div class="score-num">' + (sbarTot ? sbarOk + '/' + sbarTot : '—') + '</div><div class="score-lbl">SBAR報告</div></div>' +
          '<div class="score-box"><div class="score-num">' + (exTot ? exOk + '/' + exTot : '—') + '</div><div class="score-lbl">試験おまけ</div></div>' +
        '</div>' +
        '<div class="senpai-box">' +
          '<div class="senpai-av">' + SENPAI_SVG + '</div>' +
          '<div class="senpai-body">' +
            '<div class="senpai-name">プリセプター（先輩ナース）</div>' +
            '<div>はじめての夜勤、よく観察して動けたね。「いつもと違う音・呼吸・姿勢」に気づいて、1人で抱えず報告するのが一番の安全管理だよ。</div>' +
          '</div>' +
        '</div>' +
        '<div class="rec-list">' + rows + '</div>' +
        '<div class="act-row">' +
          '<button type="button" id="btn-restart" class="btn-primary">最初からもう一度巡視する</button>' +
        '</div>' +
      '</div>';

    app.querySelectorAll('[data-retry]').forEach(function (b) {
      b.addEventListener('click', function () { initScene(Number(b.getAttribute('data-retry'))); });
    });
    var re = document.getElementById('btn-restart');
    if (re) re.addEventListener('click', function () { state.results = {}; initScene(0); });
  }

  /* ---------- メイン描画 ---------- */
  function render() {
    renderTimeline();
    var app = document.getElementById('app');
    if (!app) return;

    if (state.view === 'summary' || !scenes.length) {
      renderSummary();
      return;
    }

    var sc = scenes[state.idx];
    var vis = buildSceneVisual(sc);
    var who = sc.who || {};
    var keysHTML = (who.key || []).map(function (k) {
      return '<span class="key-chip">' + esc(k) + '</span>';
    }).join('');

    app.innerHTML =
      '<div class="play-grid">' +
        '<div class="left-pane">' +
          '<div class="chart-strip">' +
            '<span class="time-badge">🕒 ' + esc(sc.time || '') + '</span>' +
            '<span class="place-badge">' + esc(sc.place || '') + '</span>' +
            '<span class="who-main">' + esc(who.name || '') + '（' + esc(who.age || '') + '歳・' + esc(who.sex || '') + '）</span>' +
            '<span class="who-dx">' + esc(who.dx || '') + '</span>' +
            (keysHTML ? '<div class="who-keys">' + keysHTML + '</div>' : '') +
          '</div>' +
          renderStageHTML(sc, vis) +
          '<div class="look-box"><span class="look-label">観察メモ</span>' + esc(sc.look || '') + '</div>' +
        '</div>' +
        '<div class="right-pane">' +
          renderRightPaneHTML(sc) +
        '</div>' +
      '</div>';

    /* 懐中電灯ポインタ操作 */
    var stageBox = document.getElementById('stage-box');
    var svg = document.getElementById('ward-svg');
    if (stageBox && svg) {
      var dragging = false;
      function moveFromEvent(e) {
        var ctm = svg.getScreenCTM();
        if (ctm) {
          var pt = svg.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          var loc = pt.matrixTransform(ctm.inverse());
          state.beam.x = Math.max(16, Math.min(624, loc.x));
          state.beam.y = Math.max(16, Math.min(344, loc.y));
          updateBeamDOM(vis);
          return;
        }
        var rect = svg.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var sx = ((e.clientX - rect.left) / rect.width) * 640;
        var sy = ((e.clientY - rect.top) / rect.height) * 360;
        state.beam.x = Math.max(16, Math.min(624, sx));
        state.beam.y = Math.max(16, Math.min(344, sy));
        updateBeamDOM(vis);
      }
      stageBox.addEventListener('pointerdown', function (e) {
        dragging = true;
        moveFromEvent(e);
      });
      stageBox.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' || dragging) moveFromEvent(e);
      });
      window.addEventListener('pointerup', function () { dragging = false; }, { passive: true });

      svg.querySelectorAll('[data-spot]').forEach(function (el) {
        el.addEventListener('click', function () {
          var s = Number(el.getAttribute('data-spot'));
          var sp = vis.spots[s];
          if (!sp) return;
          state.beam.x = sp.x;
          state.beam.y = sp.y;
          state.activeSpot = sp;
          if (!state.foundSpots[state.idx]) state.foundSpots[state.idx] = {};
          state.foundSpots[state.idx][s] = true;
          sfxSpot();
          updateBeamDOM(vis);
          updateSpotChipsDOM(vis);
        });
      });
    }

    /* スポットフォーカスボタン・全体薄明かり切替 */
    app.querySelectorAll('[data-focus-spot]').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = Number(b.getAttribute('data-focus-spot'));
        var sp = vis.spots[s];
        if (!sp) return;
        state.beam.x = sp.x;
        state.beam.y = sp.y;
        state.activeSpot = sp;
        if (!state.foundSpots[state.idx]) state.foundSpots[state.idx] = {};
        state.foundSpots[state.idx][s] = true;
        sfxSpot();
        updateBeamDOM(vis);
        updateSpotChipsDOM(vis);
      });
    });

    var lt = document.getElementById('light-toggle');
    if (lt) {
      lt.addEventListener('click', function () {
        state.lightAll = !state.lightAll;
        render();
      });
    }

    /* 設問の選択肢イベント */
    app.querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.qPicked !== null) return;
        var origIdx = Number(b.getAttribute('data-opt'));
        state.qPicked = origIdx;
        if (origIdx === 0) {
          state.results[state.idx].qOk++;
          sfxOk();
        } else {
          sfxNg();
        }
        render();
      });
    });

    var btnNextQ = document.getElementById('btn-next-q');
    if (btnNextQ) {
      btnNextQ.addEventListener('click', function () {
        var qs = sc.qs || [];
        if (state.qIndex + 1 < qs.length) {
          state.qIndex++;
          state.qPicked = null;
          state.qOrder = shuffleIdx((qs[state.qIndex].a || []).length, state.idx * 17 + state.qIndex * 13 + 3);
        } else if (sc.sbar) {
          state.sbarStep = true;
        } else {
          state.wrapStep = true;
        }
        render();
      });
    }

    /* SBAR 札の選択と報告 */
    app.querySelectorAll('[data-sbar-k]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.sbarDone) return;
        var k = b.getAttribute('data-sbar-k');
        var i = Number(b.getAttribute('data-sbar-i'));
        state.sbarPicked[k] = i;
        playTone(520, 0.06, 'sine', 0.03);
        render();
      });
    });

    var btnSbarGo = document.getElementById('btn-sbar-go');
    if (btnSbarGo) {
      btnSbarGo.addEventListener('click', function () {
        state.sbarDone = true;
        var ok = ['S', 'B', 'A', 'R'].every(function (k) { return state.sbarPicked[k] === 0; });
        state.results[state.idx].sbarOk = ok;
        if (ok) sfxOk(); else sfxNg();
        render();
      });
    }

    var btnSbarNext = document.getElementById('btn-sbar-next');
    if (btnSbarNext) {
      btnSbarNext.addEventListener('click', function () {
        state.sbarStep = false;
        state.wrapStep = true;
        render();
      });
    }

    /* おまけ試験問題 */
    app.querySelectorAll('[data-exam]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.examPicked !== null) return;
        var origIdx = Number(b.getAttribute('data-exam'));
        state.examPicked = origIdx;
        state.results[state.idx].examOk = (origIdx === 0);
        if (origIdx === 0) sfxOk(); else sfxNg();
        render();
      });
    });

    /* 次の巡視へ */
    var btnSceneNext = document.getElementById('btn-scene-next');
    if (btnSceneNext) {
      btnSceneNext.addEventListener('click', function () {
        state.results[state.idx].done = true;
        var cleared = saved.cleared || {};
        cleared[sc.id] = true;
        saved.cleared = cleared;
        writeSave({ cleared: cleared });

        if (state.idx + 1 < scenes.length) {
          initScene(state.idx + 1);
        } else {
          state.view = 'summary';
          render();
        }
      });
    }
  }

  /* ---------- 初期化 ---------- */
  function boot() {
    var wardEl = document.getElementById('ward-name');
    if (wardEl && D.ward && D.ward.name) wardEl.textContent = D.ward.name;

    var themeBtn = document.getElementById('themebtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var curDark = state.theme === 'dark' || (!state.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
        state.theme = curDark ? 'light' : 'dark';
        writeSave({ theme: state.theme });
        applyTheme();
      });
    }

    var soundBtn = document.getElementById('soundbtn');
    if (soundBtn) {
      function syncSound() {
        soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
        soundBtn.innerHTML = state.sound ? '🔊 <span class="lbl-sm">音オン</span>' : '🔇 <span class="lbl-sm">音オフ</span>';
      }
      syncSound();
      soundBtn.addEventListener('click', function () {
        state.sound = !state.sound;
        writeSave({ sound: state.sound });
        syncSound();
        if (state.sound) playTone(660, 0.1, 'sine', 0.04);
      });
    }

    var maxBtn = document.getElementById('maxbtn');
    if (maxBtn) maxBtn.addEventListener('click', toggleFullscreen);

    applyTheme();
    syncMaxBtn();
    initScene(0);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
